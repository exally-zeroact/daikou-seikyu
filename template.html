<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP',sans-serif;background:#F8FEFC;-webkit-font-smoothing:antialiased;}

.lay{display:flex;height:100vh;height:100dvh;background:#F8FEFC;}

/* PC サイドバー */
.sb{display:none;}
@media(min-width:769px){
.sb{display:flex;flex-direction:column;width:220px;min-width:220px;background:#ffffff;border-right:1px solid #D4EDE1;padding:24px 0;flex-shrink:0;height:100%;}
.sb-logo{padding:0 20px 28px;display:flex;align-items:baseline;gap:5px;text-decoration:none;}
.sb-en{font-family:monospace;font-size:22px;font-weight:800;color:#52B788;letter-spacing:-0.5px;}
.sb-ja{font-size:10px;font-weight:600;color:#4A6B5A;}
.sb-nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.sb-it{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;border:none;background:none;font-family:'Noto Sans JP',sans-serif;width:100%;text-align:left;color:#2E4038;font-size:13px;font-weight:500;transition:all 0.18s;}
.sb-it:hover{background:#F0FAF4;color:#2E4038;}
.sb-it.active{background:#F0FAF4;color:#2E4038;font-weight:700;}
.sb-it.nav-disabled{cursor:not-allowed;opacity:0.45;pointer-events:none;}
.sb-ic{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-ic svg{width:20px;height:20px;}
.sb-ic-emoji{font-size:15px;line-height:1;}
.sb-ft{padding:10px 18px;border-top:1px solid #D4EDE1;display:flex;flex-direction:column;gap:5px;}
.sb-bd{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-align:center;}
.sb-bd-d{background:#FFF8EE;border:1px solid #F4A942;color:#9A6000;}
.sb-bd-t{background:#F0FAF4;border:1px solid #C8ECD8;color:#3D9E72;}
}

/* メイン */
.mn{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;min-width:0;background:#F8FEFC;}

/* モバイルヘッダー */
.mh{background:#ffffff;border-bottom:1px solid #D4EDE1;padding:0 12px;height:48px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-shrink:0;}
.mh-lg{display:flex;align-items:baseline;gap:4px;text-decoration:none;}
.mh-en{font-family:monospace;font-size:20px;font-weight:800;color:#52B788;}
.mh-ja{font-size:10px;font-weight:600;color:#4A6B5A;}
.mh-r{display:flex;gap:4px;align-items:center;}
.hb{font-size:9px;font-weight:700;padding:3px 7px;border-radius:18px;}
.hb-d{background:#FFF8EE;border:1px solid #F4A942;color:#9A6000;}
.hb-t{background:#F0FAF4;border:1px solid #C8ECD8;color:#3D9E72;}
@media(max-width:480px){.hb-t{display:none;}}
@media(max-width:380px){.hb-d{display:none;}}
@media(min-width:769px){.mh{display:none;}}

/* スクロールエリア */
.sc{flex:1;overflow-y:auto;background:#F8FEFC;}
.ct{max-width:720px;margin:0 auto;padding:12px 16px 78px;}
@media(min-width:769px){.ct{max-width:1080px;padding:28px 40px 40px;width:100%;}}

/* モバイル固定ボトムナビ */
.bn{position:absolute;bottom:0;left:0;right:0;display:flex;background:#ffffff;border-top:1px solid #D4EDE1;padding-bottom:env(safe-area-inset-bottom);justify-content:space-around;align-items:center;gap:0;z-index:40;}
.bn-i{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 1px 5px;border:none;background:none;cursor:pointer;color:#2E4038;font-family:'Noto Sans JP',sans-serif;min-width:35px;flex:1;}
.bn-i.active{color:#2E4038;font-weight:700;}
.bn-i.nav-disabled{cursor:not-allowed;opacity:0.45;pointer-events:none;}
.bn-ic{display:inline-flex;align-items:center;justify-content:center;height:16px;}
.bn-ic svg{width:15px;height:15px;}
.bn-ic-emoji{font-size:15px;line-height:1;}
.bn-lb{font-size:9px;font-weight:700;letter-spacing:-0.3px;margin-top:2px;white-space:nowrap;}
@media(min-width:769px){.bn{display:none;}}

/* ========== テンプレ ギャラリー ========== */
.tmpl-back{background:none;border:none;font-size:13px;color:#3D9E72;font-weight:700;cursor:pointer;padding:0 0 10px 0;display:inline-flex;align-items:center;gap:4px;font-family:'Noto Sans JP',sans-serif;}
.tmpl-back:hover{color:#2E7D54;}
.tmpl-title{font-size:18px;font-weight:700;color:#1A4A2E;margin-bottom:4px;}
@media(min-width:769px){.tmpl-title{font-size:24px;}}
.tmpl-sub{font-size:12px;color:#7A9A87;margin-bottom:6px;line-height:1.6;}
@media(min-width:769px){.tmpl-sub{font-size:14px;}}
.tmpl-sub2{font-size:11px;color:#3D9E72;margin-bottom:18px;line-height:1.6;font-weight:500;}
@media(min-width:769px){.tmpl-sub2{font-size:13px;}}
.tmpl-grid-payslip{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:10px;}
@media(min-width:600px){.tmpl-grid-payslip{display:none;}}
.tmpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
@media(min-width:600px){.tmpl-grid{grid-template-columns:repeat(3,1fr);}}
.tmpl-card{background:#fff;border-radius:16px;overflow:hidden;border:1.5px solid #E0EDE6;cursor:pointer;transition:all 0.18s;box-shadow:0 1px 4px rgba(30,60,40,0.07);}
.tmpl-card:hover{border-color:#52B788;transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,60,40,0.12);}
.tmpl-card.wide-card{align-self:center;}
.tmpl-prev{height:170px;background:#F8FEFA;overflow:hidden;position:relative;}
.tmpl-prev.wide{height:100px;padding:0 6px;}
.tmpl-prev::after{content:’’;position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(transparent,#F8FEFA);pointer-events:none;z-index:2;}
.tmpl-prev-inner{width:100%;position:relative;transform:scale(0.70);transform-origin:top center;pointer-events:none;z-index:1;overflow:hidden;}
.tmpl-prev.wide .tmpl-prev-inner{width:154%;transform:scale(0.65);transform-origin:top left;}
.tmpl-prev-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#B0C4BA;gap:6px;}
.tmpl-prev-ph-ic{font-size:28px;}
.tmpl-prev-ph-tx{font-size:10px;}
.tmpl-prev-note{position:absolute;bottom:4px;right:6px;font-size:9px;color:#B0C4BA;z-index:3;}
.tmpl-body{padding:4px 8px 4px;}
.tmpl-name{font-size:12px;font-weight:700;color:#1A4A2E;margin-bottom:0;}

/* iframe表示画面 */
.ifr-scr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;flex-direction:column;background:#F4F7F5;}
.ifr-scr.show{display:flex;}
.ifr-bar{background:#fff;border-bottom:1px solid #E0EDE6;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.ifr-back{background:none;border:1.5px solid #E0EDE6;color:#3D9E72;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.ifr-title{font-size:13px;font-weight:700;color:#4A6B5A;}
.ifr-wrap{flex:1;overflow:clip;}
.ifr-wrap iframe{width:100%;height:100%;border:none;}

/* トースト */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1A4A2E;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:500;opacity:0;transition:opacity 0.2s;pointer-events:none;}
.toast.show{opacity:1;}
@media(min-width:769px){.toast{bottom:30px;}}
</style>

window.TEMPLATES = TEMPLATES;

// ===== トースト =====
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

// ===== ギャラリー描画 =====
function renderGallery(){
  var payslipGrid = document.getElementById('tmplGridPayslip');
  var grid = document.getElementById('tmplGrid');
  if(!grid || !payslipGrid) return;

  function makeCard(t){
    var isPayslipB = t.id==='payslip_b';
    var prevClass = 'tmpl-prev' + (isPayslipB?' wide':'');
    var cardClass = 'tmpl-card' + (isPayslipB?' wide-card':'');
    var preview = t.previewHTML
      ? '<div class="tmpl-prev-inner">' + t.previewHTML + '</div>'
      : '<div class="tmpl-prev-ph"><div class="tmpl-prev-ph-ic">📄</div><div class="tmpl-prev-ph-tx">準備中✨</div></div>';
    return '<div class="' + cardClass + '" onclick="openIfr(\'' + t.id + '\')">'
      + '<div class="' + prevClass + '">' + preview + '<div class="tmpl-prev-note">※完成イメージ</div></div>'
      + '<div class="tmpl-body"><div class="tmpl-name">' + (t.hot?'⭐ ':'') + t.name + '</div></div>'
      + '</div>';
  }

  var payslipIds = ['payslip_a','payslip_b'];
  if(window.innerWidth >= 600){
    // デスクトップ：全カードを1つのグリッドに
    payslipGrid.innerHTML = '';
    grid.innerHTML = TEMPLATES.map(makeCard).join('');
  } else {
    // モバイル：給料明細行を分離（2fr 3fr）
    payslipGrid.innerHTML = TEMPLATES.filter(function(t){ return payslipIds.indexOf(t.id)!==-1; }).map(makeCard).join('');
    grid.innerHTML = TEMPLATES.filter(function(t){ return payslipIds.indexOf(t.id)===-1; }).map(makeCard).join('');
  }
}

// ===== iframe開閉 =====
function openIfr(id){
  var tmpl = TEMPLATES.find(function(t){ return t.id === id; });
  if(!tmpl) return;
  if(!tmpl.file){ showToast('準備中だよ✨'); return; }
  document.getElementById('ifrTitle').textContent = tmpl.name;
  document.getElementById('ifr').src = tmpl.file;
  document.getElementById('ifrScr').classList.add('show');
}

function closeIfr(){
  document.getElementById('ifrScr').classList.remove('show');
  document.getElementById('ifr').src = '';
}

// ===== 初期化 =====
document.addEventListener('DOMContentLoaded', function(){
  renderGallery();
  try{
    var params = new URLSearchParams(location.search);
    var openId = params.get('open');
    if(openId) openIfr(openId);
  }catch(e){}
});
</script>
