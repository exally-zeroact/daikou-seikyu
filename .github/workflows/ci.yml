name: CI

# push / PR ごとに lint + ロジックテスト(vitest) + 画面E2E(playwright) をクラウドで自動実行。
# ローカルの husky(pre-commit/pre-push)に加えた二重の番人。PCに依存せずチーム全員の push に効く。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ★commit の文と 作者の欄に 実在の字・メールを 出さない★（2026-10-11・ダイコメ本体の test.yml の job を写した）
  #   手元の門（.husky/commit-msg・pre-push）は --no-verify・HUSKY=0・GitHub の画面の編集を 通る＝公開 repo なので CI でも見る。
  #   一覧は repo に置かない＝secret KINSHI_JI（1行に 1語）。無ければ「未測定」で 赤（飛ばさない）。
  #   当たっても 字は出さない（公開の CI の記録は 誰でも読める）。出すのは 数と commit の頭だけ。
  kinshi-commit-msg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 門の自己確認
        # 全部 通って、しかも 25 組 以上の 時だけ 緑（0/0・組が 減った を 止める・床は scripts/ci-yuka.sh）
        shell: bash
        run: |
          node scripts/kinshi-commit-msg.mjs --self-test | tee msg-self.out
          sh scripts/ci-yuka.sh msg-self.out 25
      - name: この push・PR の commit の文を見る
        shell: bash
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          EV: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EV" = "pull_request" ]; then R="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then R="$GITHUB_SHA^..$GITHUB_SHA"
          else R="$BEFORE..$GITHUB_SHA"; fi
          node scripts/kinshi-commit-msg.mjs --range "$R" | tee kinshi-msg.out
          grep -q "^✓ commit の文の 実在の字 0 件" kinshi-msg.out

  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # CI では git フックを動かさない(install時の husky を無効化)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★20 では jsdom が起動できず CI がずっと赤だった（2026-08-10 発見）★
          #   jsdom@30 の engines = ^22.22.2 || ^24.15.0 || >=26.0.0
          #   Node 20 だと undici が webidl.util.markAsUncloneable を呼べず
          #   login-brand.test.js の worker が起動しない＝手元(Node24)は緑・CIだけ赤。
          #   tests/ci-node-version.test.js が この版と engines の食い違いを見張る。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ★公開 repo に 実在の 字（司さん・会社・お客さんの 本物）を 戻さない★（2026-10-10）
      #   一覧は repo に 置かない＝secret KINSHI_JI（1行に 1語）。無ければ「未測定」で 赤。
      #   指紋（変数 KINSHI_JI_FINGER）と 違えば 赤＝secret が 縮んだ・壊れた を 止める。
      #   当たっても 字は 出さない（公開の CI ログは 誰でも 読める）。zip（xlsx 等）は ほどいて 中まで 見る。
      - name: 実在の字が戻っていないか（一覧は secret）
        timeout-minutes: 10
        # 本体が 何も 言わずに 終わる（main が 走らない 等）のを 緑に しない＝終わりの 行が 出たかも 見る
        # shell: bash＝-eo pipefail（書かないと -e だけで、tee の 前の 終わり値が 捨てられる）
        shell: bash
        run: |
          npm run kinshi | tee kinshi.out
          grep -q "^✓ 実在の 字 0 件" kinshi.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}

      - name: 実在の字の見張りの自己確認
        timeout-minutes: 10
        # 全部 通って、しかも 29 組 以上・確かめた 回数 239 以上の 時だけ 緑（組の 中の 歯を 消しても 割れる）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi-self.out
          sh scripts/ci-yuka.sh kinshi-self.out 29 239

      # ★押す commit の 中身の 門（.githooks/pre-push-kinshi.mjs）の 自己確認★（2026-10-11）
      #   門 自身は 手元の push で 走る。ここでは 門が 壊れていないか（入れて 消した 字を 赤に する 等）を 見る。
      - name: 押す commit の 中身の 門の自己確認
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push-self.out
          sh scripts/ci-yuka.sh push-self.out 13 34

      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit/logic tests (vitest)
        run: npm test

      - name: ★PDFに 字体を 丸ごと 埋めない（全アプリ共通・司さん 2026-09-05「全アプリ共通やろが」）

        run: node tests/pdf-font-weight.test.mjs

      - name: ★同 わざと壊して 赤になるか（壊した数と 赤の数を 並べる）

        run: node tests/pdf-font-weight.test.mjs --self-test

      - name: ★字体を 軽くしても 字は 1つも 変わらない（形・番号・部品を 突き合わせ）

        run: node tests/font-slim.test.mjs

      - name: ★同 わざと壊して 赤になるか

        run: node tests/font-slim.test.mjs --self-test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ★見張りだけを node 24 でも回す★（Castally の nomiya-app c30af57 の job を逐語で写した）
  kinshi-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認（node 24 の job）
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20

      - name: 実在の字が戻っていないか（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs | tee kinshi24.out
          grep -q "^✓ 実在の 字 0 件" kinshi24.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}
      - name: 実在の字の見張りの自己確認（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi24-self.out
          sh scripts/ci-yuka.sh kinshi24-self.out 29 239
      # 押す commit の 中身の 門も node 24 で（手元の 機械の node は 24・2026-10-11）
      - name: 押す commit の 中身の 門の自己確認（node 24）
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push24-self.out
          sh scripts/ci-yuka.sh push24-self.out 13 34
