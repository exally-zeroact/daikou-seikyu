name: CI

# push / PR ごとに lint + ロジックテスト(vitest) + 画面E2E(playwright) をクラウドで自動実行。
# ローカルの husky(pre-commit/pre-push)に加えた二重の番人。PCに依存せずチーム全員の push に効く。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # CI では git フックを動かさない(install時の husky を無効化)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★20 では jsdom が起動できず CI がずっと赤だった（2026-08-10 発見）★
          #   jsdom@30 の engines = ^22.22.2 || ^24.15.0 || >=26.0.0
          #   Node 20 だと undici が webidl.util.markAsUncloneable を呼べず
          #   login-brand.test.js の worker が起動しない＝手元(Node24)は緑・CIだけ赤。
          #   tests/ci-node-version.test.js が この版と engines の食い違いを見張る。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ★公開 repo に 実在の 字（司さん・会社・お客さんの 本物）を 戻さない★（2026-10-10）
      #   一覧は repo に 置かない＝secret KINSHI_JI（1行に 1語）。無ければ「未測定」で 赤。
      #   指紋（変数 KINSHI_JI_FINGER）と 違えば 赤＝secret が 縮んだ・壊れた を 止める。
      #   当たっても 字は 出さない（公開の CI ログは 誰でも 読める）。zip（xlsx 等）は ほどいて 中まで 見る。
      - name: 実在の字が戻っていないか（一覧は secret）
        timeout-minutes: 10
        # 本体が 何も 言わずに 終わる（main が 走らない 等）のを 緑に しない＝終わりの 行が 出たかも 見る
        # shell: bash＝-eo pipefail（書かないと -e だけで、tee の 前の 終わり値が 捨てられる）
        shell: bash
        run: |
          npm run kinshi | tee kinshi.out
          grep -q "^✓ 実在の 字 0 件" kinshi.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}

      - name: 実在の字の見張りの自己確認
        timeout-minutes: 10
        # 全部 通って、しかも 26 本 以上 走った 時だけ 緑（0/0・本数が 減った を 止める）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi-self.out
          awk -F'[ /]' '/^自己確認: /{ if ($2 == $3 && $2 + 0 >= 26) ok = 1 } END { exit !ok }' kinshi-self.out

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit/logic tests (vitest)
        run: npm test

      - name: ★PDFに 字体を 丸ごと 埋めない（全アプリ共通・司さん 2026-09-05「全アプリ共通やろが」）

        run: node tests/pdf-font-weight.test.mjs

      - name: ★同 わざと壊して 赤になるか（壊した数と 赤の数を 並べる）

        run: node tests/pdf-font-weight.test.mjs --self-test

      - name: ★字体を 軽くしても 字は 1つも 変わらない（形・番号・部品を 突き合わせ）

        run: node tests/font-slim.test.mjs

      - name: ★同 わざと壊して 赤になるか

        run: node tests/font-slim.test.mjs --self-test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
