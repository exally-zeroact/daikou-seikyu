name: CI

# push / PR ごとに lint + ロジックテスト(vitest) + 画面E2E(playwright) をクラウドで自動実行。
# ローカルの husky(pre-commit/pre-push)に加えた二重の番人。PCに依存せずチーム全員の push に効く。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # CI では git フックを動かさない(install時の husky を無効化)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit/logic tests (vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
